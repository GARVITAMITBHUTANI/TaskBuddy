<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Knowledge Galaxy</title>
    <script src="https://unpkg.com/3d-force-graph"></script>
    <script src="graph-data.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #graph-container {
            width: 100vw;
            height: 100vh;
        }
        #side-panel {
            position: absolute;
            top: 0;
            right: -400px;
            width: 350px;
            height: 100vh;
            background: rgba(15, 15, 25, 0.9);
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            color: #fff;
            transition: right 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            box-sizing: border-box;
            padding: 30px;
            overflow-y: auto;
            z-index: 10;
        }
        #side-panel.open {
            right: 0;
        }
        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            cursor: pointer;
            font-size: 24px;
            color: #aaa;
        }
        .close-btn:hover {
            color: #fff;
        }
        h2 {
            margin-top: 0;
            font-weight: 300;
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            padding-bottom: 10px;
        }
        .group-tag {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 12px;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .excerpt {
            line-height: 1.6;
            color: #ccc;
            white-space: pre-wrap;
        }
        
        /* Starfield background */
        #stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        /* Chat UI */
        #chat-container {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            max-width: 90vw;
            z-index: 20;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        #chat-answer {
            background: rgba(15, 15, 25, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 15px 20px;
            color: #fff;
            line-height: 1.5;
            transition: opacity 0.3s;
        }
        #chat-answer.hidden {
            display: none;
        }
        #chat-form {
            display: flex;
            gap: 10px;
            background: rgba(15, 15, 25, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 5px;
        }
        #chat-input {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            padding: 10px 20px;
            font-size: 16px;
            outline: none;
            font-family: inherit;
        }
        #chat-submit {
            background: #fff;
            color: #000;
            border: none;
            border-radius: 25px;
            padding: 0 20px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        #chat-submit:hover {
            background: #ccc;
        }
    </style>
</head>
<body>
    <div id="stars"></div>
    <div id="graph-container"></div>
    
    <div id="chat-container">
        <div id="chat-answer" class="hidden"></div>
        <form id="chat-form" onsubmit="submitChat(event)">
            <input type="text" id="chat-input" placeholder="Ask your knowledge galaxy..." autocomplete="off">
            <button type="submit" id="chat-submit">Ask</button>
        </form>
    </div>

    <div id="side-panel">
        <span class="close-btn" onclick="closePanel()">&times;</span>
        <h2 id="panel-title">Node Title</h2>
        <div id="panel-group" class="group-tag">Group</div>
        <div id="panel-excerpt" class="excerpt">Excerpt text goes here...</div>
    </div>

    <script>
        // Starfield generation
        const starsContainer = document.getElementById('stars');
        const canvas = document.createElement('canvas');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        starsContainer.appendChild(canvas);
        const ctx = canvas.getContext('2d');
        
        for (let i = 0; i < 500; i++) {
            ctx.fillStyle = `rgba(255, 255, 255, ${Math.random()})`;
            ctx.beginPath();
            ctx.arc(Math.random() * canvas.width, Math.random() * canvas.height, Math.random() * 1.5, 0, Math.PI * 2);
            ctx.fill();
        }

        // Color palette for groups
        const groupColors = {
            'Strategy': '#ff3366',
            'Finance': '#00ffcc',
            'Operations': '#ffcc00',
            'HR': '#9933ff',
            'Root': '#ffffff'
        };

        const getColor = group => groupColors[group] || '#'+Math.floor(Math.random()*16777215).toString(16);

        // Track highlights
        const highlightNodes = new Set();
        const highlightLinks = new Set();
        let hoverNode = null;
        let selectedNode = null;

        // Initialize 3D Graph
        const elem = document.getElementById('graph-container');
        
        const Graph = ForceGraph3D()(elem)
            .graphData(GRAPH)
            .nodeLabel('label')
            .nodeColor(node => highlightNodes.has(node) ? node === hoverNode || node === selectedNode ? 'rgb(255,0,0,1)' : 'rgba(255,160,0,0.8)' : getColor(node.group))
            .nodeRelSize(6)
            .nodeResolution(32)
            .linkColor(link => highlightLinks.has(link) ? 'rgba(255,255,255,0.8)' : 'rgba(255,255,255,0.1)')
            .linkWidth(link => highlightLinks.has(link) ? 2 : 1)
            .linkDirectionalParticles(link => highlightLinks.has(link) ? 4 : 0)
            .linkDirectionalParticleWidth(4)
            .onNodeHover(node => {
                if ((!node && !highlightNodes.size) || (node && hoverNode === node)) return;

                if (!selectedNode) {
                    highlightNodes.clear();
                    highlightLinks.clear();
                    if (node) {
                        highlightNodes.add(node);
                        GRAPH.links.forEach(link => {
                            if (link.source === node || link.target === node) {
                                highlightLinks.add(link);
                                highlightNodes.add(link.source === node ? link.target : link.source);
                            }
                        });
                    }
                }
                
                hoverNode = node || null;
                updateHighlight();
            })
            .onNodeClick(node => {
                const distance = 100;
                const distRatio = 1 + distance/Math.hypot(node.x, node.y, node.z);
                const newPos = node.x || node.y || node.z
                    ? { x: node.x * distRatio, y: node.y * distRatio, z: node.z * distRatio }
                    : { x: 0, y: 0, z: distance };
                    
                Graph.cameraPosition(newPos, node, 2000);

                highlightNodes.clear();
                highlightLinks.clear();
                
                highlightNodes.add(node);
                GRAPH.links.forEach(link => {
                    if (link.source.id === node.id || link.target.id === node.id) {
                        highlightLinks.add(link);
                        highlightNodes.add(link.source.id === node.id ? link.target : link.source);
                    }
                });
                
                selectedNode = node;
                updateHighlight();
                openPanel(node);
            })
            .onBackgroundClick(() => {
                selectedNode = null;
                highlightNodes.clear();
                highlightLinks.clear();
                updateHighlight();
                closePanel();
            });
            
        // Slow idle drift
        let angle = 0;
        const distance = 800;
        setInterval(() => {
            if(!selectedNode && highlightNodes.size === 0) {
                Graph.cameraPosition({
                    x: distance * Math.sin(angle),
                    z: distance * Math.cos(angle)
                });
                angle += Math.PI / 1000;
            }
        }, 30);

        function updateHighlight() {
            Graph
                .nodeColor(Graph.nodeColor())
                .linkWidth(Graph.linkWidth())
                .linkDirectionalParticles(Graph.linkDirectionalParticles());
        }

        function openPanel(node) {
            document.getElementById('panel-title').innerText = node.label;
            const groupEl = document.getElementById('panel-group');
            groupEl.innerText = node.group;
            groupEl.style.backgroundColor = getColor(node.group);
            groupEl.style.color = '#000';
            document.getElementById('panel-excerpt').innerText = node.excerpt;
            
            document.getElementById('side-panel').classList.add('open');
        }

        function closePanel() {
            document.getElementById('side-panel').classList.remove('open');
        }
        
        window.addEventListener('resize', () => {
            Graph.width(window.innerWidth);
            Graph.height(window.innerHeight);
            
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < 500; i++) {
                ctx.fillStyle = `rgba(255, 255, 255, ${Math.random()})`;
                ctx.beginPath();
                ctx.arc(Math.random() * canvas.width, Math.random() * canvas.height, Math.random() * 1.5, 0, Math.PI * 2);
                ctx.fill();
            }
        });

        // Chat Logic
        async function submitChat(e) {
            e.preventDefault();
            const input = document.getElementById('chat-input');
            const answerBox = document.getElementById('chat-answer');
            const submitBtn = document.getElementById('chat-submit');
            
            const query = input.value.trim();
            if (!query) return;
            
            answerBox.classList.remove('hidden');
            answerBox.innerHTML = '<em>Thinking...</em>';
            submitBtn.disabled = true;
            
            try {
                const res = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query })
                });
                const data = await res.json();
                
                answerBox.innerHTML = data.answer || "No answer.";
                
                if (data.nodes && data.nodes.length > 0) {
                    highlightNodes.clear();
                    highlightLinks.clear();
                    selectedNode = null;
                    
                    data.nodes.forEach(id => {
                        const node = GRAPH.graphData().nodes.find(n => n.id === id);
                        if (node) {
                            highlightNodes.add(node);
                        }
                    });
                    
                    const firstNode = Array.from(highlightNodes)[0];
                    if (firstNode) {
                        const dist = 250;
                        const distRatio = 1 + dist/Math.hypot(firstNode.x || 1, firstNode.y || 1, firstNode.z || 1);
                        Graph.cameraPosition(
                            { x: (firstNode.x||0) * distRatio, y: (firstNode.y||0) * distRatio, z: (firstNode.z||0) * distRatio },
                            firstNode,
                            2000
                        );
                    }
                    updateHighlight();
                }
            } catch (err) {
                answerBox.innerHTML = `<span style="color: #ff3366">Error: ${err.message}</span>`;
            }
            
            submitBtn.disabled = false;
        }
    </script>
</body>
</html>
